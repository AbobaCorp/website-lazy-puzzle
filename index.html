<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Собери Руслана</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Собери Руслана</h1>
    <div class="hud">
      <span id="hLv"></span><span>Время <b id="hT">0:00</b></span><span>Ходы <b id="hM">0</b></span><span
        id="hPw">Собрано <b id="hP">0</b></span>
    </div>
  </header>
  <div id="stage"></div>
  <div class="controls">
    <button class="btn ghost" id="bRot" hidden>Повернуть выбранный (R)</button>
    <button class="btn ghost" id="bGive">Сдаться: любимое занятие</button>
    <button class="btn ghost" id="bSnd">Звук: вкл</button>
    <div class="tip" id="tip"></div>
  </div>
  <div class="ov" id="ov">
    <div class="card" id="card"></div>
  </div>
  <div id="toast"></div>

  <script>
    /* ===== НАСТРОЙКИ: имена файлов, размеры сетки, режимы ===== */
    const LEVELS = [
      { src: 'img/level1.jpg', n: 3, mode: 'free', rot: 0, title: 'Разминка для лентяя', sub: 'Тащи кусочки на поле. Даже ты справишься. Наверное.', tip: 'Тащи кусочки к сетке — подходящий встанет на место' },
      { src: 'img/level2.jpg', n: 4, mode: 'free', rot: 0, title: 'Уровень 2', sub: 'Теперь со временем и счётчиком ходов. Руслан уже зевает.', tip: 'Тащи кусочки к сетке — подходящий встанет на место' },
      { src: 'img/level3.jpg', n: 5, mode: 'free', rot: .6, title: 'Кусочки спят', sub: 'Часть кусочков перевёрнута. Клик по кусочку поворачивает его.', tip: 'Клик по кусочку — поворот. Тащи, чтобы переместить' },
      { src: 'img/level4.jpg', n: 6, mode: 'swap', rot: .75, limit: 600, title: 'Финальный босс', sub: 'Сильнее только пара в 8:00. Кусочки меняются местами, часть повёрнута, время ограничено, подсказок нет.', tip: 'Выбери кусочек, затем второй — они поменяются. R — повернуть выбранный' }
    ];
    /* ========================================================== */
    const $ = id => document.getElementById(id);
    const stage = $('stage'), ov = $('ov'), card = $('card');
    let lv = 0, cols, rows, s, bw, bh, th, pieces = [], moves = 0, locked = 0, sel = null, t0 = 0, last = 0, playing = false, z = 10, totT = 0, totM = 0, mute = false, ac, cache = {};
    const rnd = n => Math.floor(Math.random() * n), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const fmt = ms => { const t = Math.floor(ms / 1000); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0') };
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const mod = d => ((d % 360) + 360) % 360;

    function beep(f = 660, d = .09) { if (mute) return; try { ac = ac || new AudioContext(); const o = ac.createOscillator(), g = ac.createGain(); o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.14, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d); o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d) } catch (e) { } }
    let tt; function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 3200) }
    function showOv(html) { card.innerHTML = html; ov.hidden = false }
    function hideOv() { ov.hidden = true }

    function loadImg(src) { if (cache[src]) return Promise.resolve(cache[src]); return new Promise((res, rej) => { const i = new Image(); i.onload = () => { cache[src] = i; res(i) }; i.onerror = () => rej(); i.src = src }) }

    async function startLevel(i) {
      lv = i; const L = LEVELS[i]; playing = false;
      showOv('<h2>Руслан ещё не проснулся…</h2><p>Загружаем</p>');
      let img;
      try { img = await loadImg(L.src); await sleep(500) } catch (e) {
        showOv(`<h2>Не нашёл ${L.src}</h2><p>Положи фото с таким именем в одну папку с index.html и нажми кнопку.</p><button class="btn" id="again">Попробовать снова</button>`);
        $('again').onclick = () => startLevel(i); return;
      }
      build(img, L);
      showOv(`<h2>${L.title}</h2><p class="big">${L.sub}</p><p>Сетка ${cols}×${rows}${L.limit ? ', лимит ' + fmt(L.limit * 1000) : ''}</p><button class="btn" id="go">Поехали</button>`);
      $('go').onclick = () => { hideOv(); playing = true; last = performance.now() };
    }

    function build(img, L) {
      stage.innerHTML = ''; pieces = []; moves = 0; locked = 0; sel = null; t0 = 0; z = 10;
      const free = L.mode === 'free', a = img.naturalWidth / img.naturalHeight;
      cols = Math.max(2, Math.round(L.n * Math.sqrt(a))); rows = Math.max(2, Math.round(L.n / Math.sqrt(a)));
      const availW = Math.min(innerWidth - 24, 900), availH = Math.max(260, innerHeight - 190);
      s = Math.floor(Math.max(24, Math.min(availW / cols, availH / (rows * (free ? 1.65 : 1)))));
      bw = cols * s; bh = rows * s; th = free ? Math.round(rows * s * .65) : 0;
      stage.style.cssText = `width:${bw}px;height:${bh + th}px;--s:${s}px`;
      stage.className = free ? '' : 'swap';
      const b = document.createElement('div'); b.className = 'board'; b.style.cssText = `width:${bw}px;height:${bh}px`; stage.appendChild(b);
      // обрезка картинки по центру под пропорции сетки, чтобы кусочки были квадратными
      const g = cols / rows, iw = img.naturalWidth, ih = img.naturalHeight; let sw, sh, sx, sy;
      if (a > g) { sh = ih; sw = ih * g; sx = (iw - sw) / 2; sy = 0 } else { sw = iw; sh = iw / g; sx = 0; sy = (ih - sh) / 2 }
      const px = Math.round(s * Math.min(devicePixelRatio || 1, 2));
      const perm = [...Array(cols * rows).keys()].sort(() => Math.random() - .5);
      for (let r = 0; r < rows; r++)for (let c = 0; c < cols; c++) {
        const cv = document.createElement('canvas'); cv.width = cv.height = px; cv.className = 'piece';
        cv.getContext('2d').drawImage(img, sx + c * sw / cols, sy + r * sh / rows, sw / cols, sh / rows, 0, 0, px, px);
        const id = r * cols + c;
        const p = { id, c, r, el: cv, rot: Math.random() < L.rot ? 90 * (1 + rnd(3)) : 0, locked: false, x: 0, y: 0, idx: perm[id] };
        cv.style.transform = `rotate(${p.rot}deg)`;
        if (free) { p.x = rnd(Math.max(1, bw - s)); p.y = bh + 8 + rnd(Math.max(1, th - s - 8)); cv.addEventListener('pointerdown', e => onDown(e, p)) }
        else { p.x = (p.idx % cols) * s; p.y = Math.floor(p.idx / cols) * s; cv.addEventListener('click', () => onSwap(p)) }
        pos(p); stage.appendChild(cv); pieces.push(p);
      }
      $('bRot').hidden = free; $('tip').textContent = L.tip;
      $('hPw').hidden = !free; hud();
    }
    function pos(p) { p.el.style.left = p.x + 'px'; p.el.style.top = p.y + 'px' }
    function begin() { if (!t0) t0 = performance.now() }

    /* --- свободные кусочки --- */
    function onDown(e, p) {
      if (p.locked || !playing) return; e.preventDefault();
      const el = p.el; el.setPointerCapture(e.pointerId);
      const sr = stage.getBoundingClientRect(), ox = e.clientX - sr.left - p.x, oy = e.clientY - sr.top - p.y, x0 = e.clientX, y0 = e.clientY; let moved = false;
      el.style.zIndex = ++z; el.classList.add('drag');
      const mv = ev => {
        if (Math.abs(ev.clientX - x0) + Math.abs(ev.clientY - y0) > 6) moved = true;
        if (moved) { p.x = clamp(ev.clientX - sr.left - ox, 0, bw - s); p.y = clamp(ev.clientY - sr.top - oy, 0, bh + th - s); pos(p) }
      };
      const up = () => {
        el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); el.classList.remove('drag');
        begin(); last = performance.now();
        if (moved) { moves++; trySnap(p) } else if (LEVELS[lv].rot) { turn(p) }
        hud()
      };
      el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    }
    function turn(p) { p.rot += 90; p.el.style.transform = `rotate(${p.rot}deg)`; moves++; beep(420, .05); if (LEVELS[lv].mode === 'free') trySnap(p); else checkSwapWin() }
    function trySnap(p) {
      if (mod(p.rot) !== 0) return;
      const tx = p.c * s, ty = p.r * s;
      if (Math.hypot(p.x - tx, p.y - ty) < s * .35) {
        p.x = tx; p.y = ty; pos(p); p.locked = true; locked++;
        p.el.classList.add('locked', 'flash'); beep(780 + locked * 8);
        if (locked === pieces.length) win();
      }
    }

    /* --- обмен местами (последний уровень) --- */
    function onSwap(p) {
      if (!playing) return; begin(); last = performance.now();
      if (!sel) { sel = p; p.el.classList.add('sel'); return }
      if (sel === p) { p.el.classList.remove('sel'); sel = null; return }
      [sel.idx, p.idx] = [p.idx, sel.idx];
      for (const q of [sel, p]) { q.x = (q.idx % cols) * s; q.y = Math.floor(q.idx / cols) * s; pos(q) }
      sel.el.classList.remove('sel'); sel = null; moves++; beep(520, .06); hud(); checkSwapWin();
    }
    function rotSel() { if (sel && playing && LEVELS[lv].mode === 'swap') { last = performance.now(); begin(); turn(sel); hud() } }
    function checkSwapWin() { if (pieces.every(p => p.idx === p.id && mod(p.rot) === 0)) win() }

    /* --- ход игры --- */
    function hud() {
      const L = LEVELS[lv], el = t0 ? performance.now() - t0 : 0;
      $('hLv').textContent = 'Уровень ' + (lv + 1) + ' из ' + LEVELS.length;
      const T = $('hT');
      if (L.limit) { const left = Math.max(0, L.limit * 1000 - el); T.textContent = fmt(left); T.className = left < 60000 ? 'low' : '' } else T.textContent = fmt(el);
      $('hM').textContent = moves; $('hP').textContent = locked + '/' + pieces.length;
    }
    setInterval(() => {
      if (!playing) return; const now = performance.now();
      if (t0 && LEVELS[lv].limit && now - t0 >= LEVELS[lv].limit * 1000) { lose(); return }
      if (now - last > 25000) { toast('Руслан бы уже сдался'); last = now }
      hud();
    }, 250);

    function win() {
      if (!playing) return; playing = false;
      const L = LEVELS[lv], el = t0 ? performance.now() - t0 : 0; totT += el; totM += moves;
      [523, 659, 784].forEach((f, i) => setTimeout(() => beep(f, .14), i * 110));
      setTimeout(() => {
        if (lv < LEVELS.length - 1) {
          const fast = el < L.n * L.n * 2000;
          const msg = fast ? 'Подозрительно. Ты точно не Руслан?' : 'Собрал за ' + fmt(el) + '. Руслан бы не начал.';
          showOv(`<h2>Уровень пройден</h2><p class="big">${msg}</p><div class="stats"><span><b>${fmt(el)}</b>время</span><span><b>${moves}</b>ходов</span></div><button class="btn" id="nx">Дальше</button>`);
          $('nx').onclick = () => startLevel(lv + 1);
        } else final();
      }, 700);
    }
    function lose() {
      playing = false; beep(200, .4);
      showOv(`<h2>Время вышло</h2><p class="big">Руслан бы даже не пришёл.</p><button class="btn" id="re">Ещё раз</button>`);
      $('re').onclick = () => startLevel(lv);
    }
    const QUIPS = ['Руслан бы уже уснул на втором кусочке.', 'Зато ты на пару пришёл.', 'Руслан сейчас пишет «я заболел».', 'Это было быстрее, чем Руслан встаёт с кровати.', 'Руслан передаёт: «Я бы тоже мог, но завтра».', 'Пазл собран. Конспект Руслана всё ещё пуст.'];
    function final() {
      showOv(`<h2 id="ft" style="cursor:pointer">Ты собрал Руслана целиком</h2><p class="big">Он бы столько не вытерпел.</p>
  <div class="col">${LEVELS.map(l => `<img src="${l.src}" alt="">`).join('')}</div>
  <div class="stats"><span><b>${fmt(totT)}</b>общее время</span><span><b>${totM}</b>ходов</span></div>
  <p id="quip">&nbsp;</p><button class="btn" id="ag">Сыграть заново</button>`);
      $('ft').onclick = () => { $('quip').textContent = QUIPS[rnd(QUIPS.length)]; beep(600, .06) };
      $('ag').onclick = () => { totT = totM = 0; startLevel(0) };
    }

    /* --- кнопки --- */
    $('bGive').onclick = async () => {
      if (ov.hidden === false) return; toast('Классика. Начинаем сначала.');
      build(cache[LEVELS[lv].src], LEVELS[lv]); playing = true; last = performance.now();
    };
    $('bSnd').onclick = () => { mute = !mute; $('bSnd').textContent = 'Звук: ' + (mute ? 'выкл' : 'вкл') };
    $('bRot').onclick = rotSel;
    addEventListener('keydown', e => { if ((e.key === 'r' || e.key === 'R' || e.key === 'к' || e.key === 'К')) rotSel() });

    /* --- старт --- */
    showOv(`<h2>Собери Руслана</h2><p class="big">4 фото. 0 подсказок. 1 лентяй.</p><p>Готовой картинки нигде не будет: собирай по памяти.</p><button class="btn" id="st">Играть</button>`);
    $('st').onclick = () => startLevel(0);
  </script>
</body>

</html>
