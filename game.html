<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Собери Руслана: игра</title>
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&display=swap">
  <link rel="stylesheet" href="css/main.css">
</head>

<body>
  <header>
    <h1>Собери Руслана</h1>
    <div class="hud">
      <span id="hLv"></span><span>Время <b id="hT">0:00</b></span><span>Ходы <b id="hM">0</b></span><span
        id="hPw">Собрано <b id="hP">0</b></span>
    </div>
  </header>
  <div id="stage"></div>
  <div class="controls">
    <button class="btn ghost" id="bRot" hidden>Повернуть выбранный (R)</button>
    <a class="btn ghost" href="index.html">В меню</a>
    <button class="btn ghost" id="bGive">Сдаться: любимое занятие</button>
    <button class="btn ghost" id="bSnd">Звук: вкл</button>
    <div class="tip" id="tip"></div>
  </div>
  <div class="ov" id="ov">
    <div class="card" id="card"></div>
  </div>
  <div id="toast"></div>
  
  <script src="js/main.js"></script>
</body>

</html>
